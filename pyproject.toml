[project]
name = "hk-live-mcp"
version = "0.1.0"
description = "MCP server for Hong Kong real-time public data: HKO weather, MTR next train, KMB bus ETA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
hk-live-mcp = "hk_live_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
evals = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hk_live_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
